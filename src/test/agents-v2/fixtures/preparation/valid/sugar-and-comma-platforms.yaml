# Exercises everything Normalize is responsible for collapsing:
#   - a comma-list platform key that must split into two exact keys
#   - the `actions:` sugar that must become a single unconditional strategy
#   - omitted select/elevation/timeouts that must be filled explicitly
#   - providers: ["*"] that must collapse to "every provider"
# The normalized JSON for this file is the readable proof that an author's
# convenience never reaches a consumer.
schema: 1

preparation:
  prompt: Set up the container toolchain?

  precheck:
    - id: docker
      label: Docker available
      providers: ["*"]
      platforms:
        "darwin,linux":
          check:
            kind: command
            argv: ["docker", "info"]
        windows:
          check:
            kind: command
            argv: ["docker", "version"]
            timeout_seconds: 30

  preconfigure:
    configure:
      - id: write-registry-env
        label: Record registry credentials
        providers: [claude, codex]
        platforms:
          all:
            actions:
              - kind: env-file
                path: ~/.aziron/registry.env
                vars:
                  - name: REGISTRY_URL
                    label: Registry URL
                    required: true
                    default: https://index.docker.io/v1/
                  - name: REGISTRY_TOKEN
                    label: Registry token
                    required: true
                    secret: true
